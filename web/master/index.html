<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Senlings 工事台帳</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: #f5f4f1;
      color: #2a2a26;
      min-height: 100vh;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }
    .brand {
      font-family: 'Noto Serif JP', serif;
      font-size: 13px;
      letter-spacing: 0.35em;
      color: #8a7340;
      margin-bottom: 4px;
    }
    h1 {
      font-size: 22px;
      font-weight: 400;
      letter-spacing: 0.08em;
      margin-bottom: 36px;
    }

    .card {
      background: #fff;
      border: 1px solid #e3e0d8;
      border-radius: 10px;
      padding: 28px;
      margin-bottom: 28px;
    }

    .field { margin-bottom: 18px; }
    .field label {
      display: block;
      font-size: 13px;
      color: #6b6757;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      font-family: inherit;
      border: 1px solid #d8d4c8;
      border-radius: 6px;
      background: #fdfdfb;
      color: #2a2a26;
    }
    .field input:focus {
      outline: none;
      border-color: #8a7340;
    }
    .field .optional {
      font-size: 11px;
      color: #aaa593;
      margin-left: 6px;
    }

    .btn-primary {
      padding: 11px 28px;
      font-size: 15px;
      font-family: inherit;
      letter-spacing: 0.08em;
      background: #2a2a26;
      color: #f5f4f1;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-primary:hover { background: #45453e; }
    .btn-primary:disabled { background: #b5b2a6; cursor: default; }

    .btn-quiet {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 13px;
      color: #8a8576;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .msg {
      font-size: 13px;
      margin-top: 14px;
      min-height: 1.2em;
    }
    .msg.error { color: #a05030; }
    .msg.ok    { color: #4a7a3a; }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 36px;
    }
    .header-row h1 { margin-bottom: 0; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th {
      text-align: left;
      font-size: 12px;
      font-weight: 400;
      color: #8a8576;
      letter-spacing: 0.08em;
      padding: 8px 10px;
      border-bottom: 1px solid #e3e0d8;
    }
    td {
      padding: 10px;
      border-bottom: 1px solid #efede6;
      vertical-align: top;
    }
    .list-empty {
      font-size: 13px;
      color: #aaa593;
      padding: 18px 10px;
      font-family: 'Noto Serif JP', serif;
    }
    .section-label {
      font-family: 'Noto Serif JP', serif;
      font-size: 12px;
      color: #8a7340;
      letter-spacing: 0.2em;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- ── ログイン ── -->
    <div id="view-login">
      <p class="brand">SENLINGS</p>
      <h1>工事台帳</h1>
      <div class="card" style="max-width:420px;">
        <div class="field">
          <label for="login-email">メールアドレス</label>
          <input type="email" id="login-email" autocomplete="username">
        </div>
        <div class="field">
          <label for="login-password">パスワード</label>
          <input type="password" id="login-password" autocomplete="current-password">
        </div>
        <button class="btn-primary" id="btn-login">入る</button>
        <p class="msg" id="login-msg"></p>
      </div>
    </div>

    <!-- ── 台帳（ログイン後） ── -->
    <div id="view-main" hidden>
      <p class="brand">SENLINGS</p>
      <div class="header-row">
        <h1>工事台帳</h1>
        <button class="btn-quiet" id="btn-logout">出る</button>
      </div>

      <div class="card">
        <p class="section-label">工事の登録</p>
        <div class="field">
          <label for="f-name">工事名</label>
          <input type="text" id="f-name" placeholder="請求書はこの名前で出ます">
        </div>
        <div class="field">
          <label for="f-address">住所<span class="optional">あとからでも</span></label>
          <input type="text" id="f-address">
        </div>
        <div class="field">
          <label for="f-code">工事コード<span class="optional">あとからでも</span></label>
          <input type="text" id="f-code">
        </div>
        <div class="field">
          <label for="f-contact">担当者名<span class="optional">あとからでも</span></label>
          <input type="text" id="f-contact">
        </div>
        <button class="btn-primary" id="btn-register">登録する</button>
        <p class="msg" id="register-msg"></p>
      </div>

      <div class="card">
        <p class="section-label">登録済みの工事</p>
        <div id="project-list"></div>
      </div>
    </div>

  </div>
  <script type="module" src="master.js"></script>
</body>
</html>
